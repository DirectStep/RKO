name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rko
          POSTGRES_USER: rko
          POSTGRES_PASSWORD: rko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rko -d rko"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BOT_TOKEN: 123456:test-token
      DATABASE_URL: postgresql+asyncpg://rko:rko@localhost:5432/rko
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest
      - run: alembic upgrade head
      - run: python3 -m app.healthcheck
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: docker build .
