name: rko-tracker

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rko
      POSTGRES_USER: rko
      POSTGRES_PASSWORD: rko
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rko -d rko"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rko:rko@db:5432/rko}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROJECT_TIMEZONE: ${PROJECT_TIMEZONE:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python3 -m app.main"]
    restart: unless-stopped

volumes:
  postgres_data:
