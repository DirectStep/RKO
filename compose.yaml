name: rko-tracker

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rko
      POSTGRES_USER: rko
      POSTGRES_PASSWORD: rko
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rko -d rko"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rko:rko@db:5432/rko}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROJECT_TIMEZONE: ${PROJECT_TIMEZONE:-Europe/Moscow}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      ADMIN_TELEGRAM_USERNAMES: ${ADMIN_TELEGRAM_USERNAMES:-}
      MINI_APP_URL: ${MINI_APP_URL:-http://localhost:8090}
      MINI_APP_HOST: ${MINI_APP_HOST:-0.0.0.0}
      MINI_APP_PORT: ${MINI_APP_PORT:-8090}
      MINI_APP_DEV_TELEGRAM_ID: ${MINI_APP_DEV_TELEGRAM_ID:-}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      SHEETS_SYNC_INTERVAL_SECONDS: ${SHEETS_SYNC_INTERVAL_SECONDS:-180}
    volumes:
      - ./secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python3 -m app.main"]
    restart: unless-stopped

  tunnel:
    image: node:22-alpine
    command: ["npx", "--yes", "localtunnel", "--port", "8090", "--local-host", "bot"]
    depends_on:
      - bot
    restart: unless-stopped
    profiles: ["demo"]

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
