services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a production database password}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    # The DNS-selected Telegram endpoint is unreachable from this VPS.
    # Keep the API hostname and normal TLS verification, using a reachable IPv4.
    extra_hosts:
      - "api.telegram.org=${TELEGRAM_API_IPV4:-149.154.167.220}"
    environment:
      APP_ENV: production
      MINI_APP_DEV_TELEGRAM_ID: ""
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  adminer:
    profiles: [admin]

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
